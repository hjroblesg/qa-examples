[pytest]
# Unit layer only. Robot Framework suites under tests/*.robot are the
# functional/integration layer and are run separately (robot tests/).
testpaths = tests/unit
pythonpath = src
addopts = -ra -q --strict-markers
markers =
    unit: fast, fully isolated logic tests with no real containers
    docker_logic: command-building / branching logic of the Docker validator
    mysql: MySQLValidator checks with the DB client mocked (no real database)
    edge: boundary and error-path cases
    regression: pins behaviour of a bug found by these tests (see tests/unit/README.md)
