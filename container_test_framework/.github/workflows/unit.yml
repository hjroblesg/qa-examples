name: Unit

# The code gate: runs on every pull request (and push to main). Fast and
# Docker-free — every external seam is mocked. Mark this as a required status
# check in branch protection so no framework change merges without it passing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test toolchain
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        # pytest.ini scopes collection to tests/unit and adds --strict-markers.
        run: pytest --cov=ctf --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
