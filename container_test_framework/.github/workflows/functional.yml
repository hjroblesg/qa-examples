name: Functional

# The heavier real-container suite. Deliberately NOT run on pull requests — it
# runs after a merge to main and on demand (manual dispatch), to keep PRs fast
# and cheap while still exercising the full stack against real containers.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  functional:
    name: Functional (Robot, real containers)
    runs-on: ubuntu-latest   # Docker is preinstalled on GitHub-hosted runners
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime deps + the ctf package
        # The Robot suites drive lifecycle through `python -m ctf`, so the
        # package must be importable.
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run Robot functional suites
        run: >
          robot
          --outputdir ci-robot-results
          tests/mysql_tests.robot
          tests/rest_api_tests.robot

      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: ci-robot-results/
          if-no-files-found: ignore
