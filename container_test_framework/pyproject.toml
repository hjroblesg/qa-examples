[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "container-test-framework"
version = "0.1.0"
description = "A container-agnostic engine and pluggable validators for testing containers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hector Robles" }]

[project.scripts]
ctf = "ctf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# pytest configuration lives in pytest.ini (single source of truth).
