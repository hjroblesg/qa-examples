name: Functional (container-test-framework)

# Portfolio monorepo: lives at the REPO ROOT (.github/workflows/) but targets the
# container_test_framework/ subfolder. The heavier real-container suite —
# deliberately NOT on pull requests. Runs after a merge to main (when the
# framework changes) and on demand, to keep PRs fast while still exercising the
# full stack against real containers.
on:
  push:
    branches: [main]
    paths:
      - 'container_test_framework/**'
      - '.github/workflows/functional.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: container_test_framework

jobs:
  functional:
    name: Functional (Robot, real containers)
    runs-on: ubuntu-latest   # Docker is preinstalled on GitHub-hosted runners
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: container_test_framework/requirements.txt

      - name: Install runtime deps + the ctf package
        # The Robot suites drive lifecycle through `python -m ctf`, so the
        # package must be importable.
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run Robot functional suites
        run: >
          robot
          --outputdir ci-robot-results
          tests/mysql_tests.robot
          tests/rest_api_tests.robot

      - name: Upload Robot reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          # artifact paths are relative to the repo root, not working-directory
          path: container_test_framework/ci-robot-results/
          if-no-files-found: ignore
