name: Unit (container-test-framework)

# Portfolio monorepo: this workflow lives at the REPO ROOT (.github/workflows/)
# but targets the container_test_framework/ subfolder only.
#
# The code gate: runs on every pull request (and push to main) that touches the
# framework. Fast and Docker-free — every external seam is mocked. Mark this as a
# required status check in branch protection so no framework change merges without
# it passing.
on:
  push:
    branches: [main]
    paths:
      - 'container_test_framework/**'
      - '.github/workflows/unit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'container_test_framework/**'
      - '.github/workflows/unit.yml'

# All `run:` steps execute inside the subfolder.
defaults:
  run:
    working-directory: container_test_framework

jobs:
  unit:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: container_test_framework/requirements-dev.txt

      - name: Install test toolchain
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        # pytest.ini scopes collection to tests/unit and adds --strict-markers.
        run: pytest --cov=ctf --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          # artifact paths are relative to the repo root, not working-directory
          path: container_test_framework/coverage.xml
          if-no-files-found: ignore
